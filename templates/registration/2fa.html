{% extends 'base.html' %}{% block content %}<div class="auth card"><h1>Двухфакторная защита</h1>{% if provisioning %}<p>Добавьте этот ключ в приложение-аутентификатор. Сохраните его конфиденциально.</p><textarea readonly rows="5">{{ provisioning }}</textarea>{% endif %}<p>Введите текущий шестизначный код.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>Код<input name="token" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button class="primary">Подтвердить</button></form></div>{% endblock %}
