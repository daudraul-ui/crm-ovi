{% extends 'base.html' %}{% block content %}<h1>Уведомления</h1>{% for obj in objects %}<section class="card"><p>{{ obj.text }}</p><small>{{ obj.created_at }}</small>{% if not obj.read %}<form method="post">{% csrf_token %}<input type="hidden" name="id" value="{{ obj.pk }}"><button>Прочитано</button></form>{% else %}<span class="badge">Прочитано</span>{% endif %}</section>{% empty %}<p>Новых уведомлений нет</p>{% endfor %}{% endblock %}
